name: satpol

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-satpol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-satpol}
      POSTGRES_DB: ${DB_DATABASE:-satpol_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-satpol} -d ${DB_DATABASE:-satpol_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - satpol-net

  # ── Silo (Lightweight S3-compatible Object Storage) ───────────────────
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    volumes:
      - silo_data:/data
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - satpol-net

  # ── One-off: Auto-create bucket & public download policy ────────────
  silo-init:
    image: docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://silo:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
        mc mb --ignore-existing local/${AWS_BUCKET:-satpol-storage};
        mc anonymous set download local/${AWS_BUCKET:-satpol-storage};
        exit 0;
      "
    networks:
      - satpol-net

networks:
  satpol-net:
    driver: bridge

volumes:
  postgres_data:
  silo_data:
